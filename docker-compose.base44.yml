services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: simdevpass
      MYSQL_DATABASE: simulador_corretora
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psimdevpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: on-failure
    volumes:
      - db_data:/var/lib/mysql

  backend:
    image: node:18
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=simdevpass
      - DB_NAME=simulador_corretora
      - DB_PORT=3306
      - PORT=3000
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx nodemon index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure

  frontend:
    image: node:18
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:8080"
    environment:
      - API_PROXY_TARGET=http://backend:3000
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
    depends_on:
      backend:
        condition: service_healthy
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vue-cli-service serve --host 0.0.0.0 --port 8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure

volumes:
  db_data:
